name: pulseledger-day5

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: pulseledger
      POSTGRES_PASSWORD: pulseledger
      POSTGRES_DB: pulseledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseledger -d pulseledger"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://pulseledger:pulseledger@postgres:5432/pulseledger
      APP_DATABASE_URL: postgresql+asyncpg://pulseledger_app:pulseledger_app@postgres:5432/pulseledger
      REDIS_URL: redis://redis:6379/0
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8005
    ports:
      - "4005:4005"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
